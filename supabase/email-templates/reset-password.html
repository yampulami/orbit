<!-- Supabase: Authentication > Emails > Reset password. Subject: Your Orbit reset code. The app asks for the code ({{ .Token }}), so keep it in the email. The animated orb is web/public/email/orbit-hello.gif (made by web/scripts/make-email-art.py); it needs Site URL set to the live address. -->
<div style="margin:0;padding:24px 12px;background:#f1f2ee">
  <span style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f1f2ee">Your Orbit code to choose a new password.</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;margin:0 auto">
    <tr><td align="center" style="padding:0 0 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.4px;color:#151a18">
      <span style="display:inline-block;width:12px;height:12px;border-radius:6px;background:#b5472a;margin-right:8px"></span>Orbit
    </td></tr>
    <tr><td align="center" bgcolor="#ffffff" style="background:#ffffff;border:1px solid #d3d8cf;border-radius:12px;padding:28px 28px 32px">
      <img src="{{ .SiteURL }}/email/orbit-hello.gif" width="240" height="132" alt="Orbit" style="display:block;margin:0 auto 12px;border:0;width:240px;height:132px;max-width:100%">
      <h1 style="margin:0 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:28px;line-height:1.2;font-weight:700;color:#151a18;text-align:center">Your reset code</h1>
      <p style="margin:0 0 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#4f5a55;text-align:center">Type this code in Orbit to choose a new password. It works for one hour.</p>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td align="center" bgcolor="#f1f2ee" style="background:#f1f2ee;border:1px solid #d3d8cf;border-radius:8px;padding:18px 12px;font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:10px;color:#151a18">{{ .Token }}</td></tr></table>
      <p style="margin:22px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#4f5a55;text-align:center">If you did not ask for this, you can ignore this email. Your password stays as it is.</p>
    </td></tr>
    <tr><td align="center" style="padding:16px 4px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#4f5a55">Orbit &middot; campus life, in one place</td></tr>
  </table>
</div>
