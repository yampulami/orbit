<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <meta name="description" content="Orbit is a campus app that lines up your class schedule with your friends’ free time and turns the gap into a plan. A senior capstone project." />
    <meta property="og:title" content="Orbit: find the hour you’re both free" />
    <meta property="og:description" content="Pick who’s in, see the hours everyone is free, and plan one. Sample week included." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#fbf7f3" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("orbit-theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e0c15");
        } catch (e) {}
      })();
    </script>
    <title>Orbit: find the hour you’re both free</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
