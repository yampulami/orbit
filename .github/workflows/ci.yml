name: Checks

# Runs on every pull request and on main. A pull request cannot be merged until this passes (set in GitHub: Settings, Rules).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
